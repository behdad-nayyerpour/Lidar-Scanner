name: LidarScanner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions:
    - en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: NO
    ENABLE_MODULE_VERIFIER: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    GENERATE_INFOPLIST_FILE: NO
    CLANG_ENABLE_MODULES: YES

targets:
  LidarScanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LidarScanner
        excludes:
          - Info.plist
      - path: ThirdParty
        excludes:
          - "**/LICENSE"
    settings:
      base:
        PRODUCT_NAME: LidarScanner
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lidarscanner
        INFOPLIST_FILE: LidarScanner/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AppAccent
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: LidarScanner/Fusion/LidarScanner-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/LidarScanner/Fusion
          - $(SRCROOT)/ThirdParty/xatlas
          - $(SRCROOT)/ThirdParty/meshoptimizer
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        GCC_ENABLE_CPP_RTTI: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""

  LidarScannerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LidarScannerTests
        excludes:
          - "Fixtures/**"
    resources:
      - path: LidarScannerTests/Fixtures/RealScan
        type: folder
    preBuildScripts:
      - name: Copy real scan fixture
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          src="${SRCROOT}/LidarScannerTests/Fixtures/RealScan"
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/RealScan"
          mkdir -p "${dest}"
          cp -R "${src}/." "${dest}/"
    dependencies:
      - target: LidarScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lidarscanner.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

schemes:
  LidarScanner:
    build:
      targets:
        LidarScanner: all
    test:
      config: Debug
      targets:
        - LidarScannerTests
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
